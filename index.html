<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kim App Web Preview</title>
  <style>
    :root {
      --background: #ffffff;
      --surface: #f4f6f8;
      --surface-muted: #e9edf2;
      --border: #d5dbe2;
      --text: #0e1116;
      --muted: #4a5360;
      --primary: #1f6feb;
      --primary-dark: #1858bd;
      --success: #2e8b57;
      --danger: #b3261e;
      --warn: #b26a00;
      --done-surface: #e6f3ec;
      --shadow: 0 10px 26px rgba(14, 17, 22, 0.09);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --content-max: 760px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.35;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 144px;
    }

    .page {
      width: min(100%, var(--content-max));
      margin: 0 auto;
      padding: 24px;
    }

    .header-block {
      margin-bottom: 18px;
    }

    .header-row,
    .notes-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .date-label,
    .label,
    .time,
    .muted {
      color: var(--muted);
      font-weight: 650;
    }

    .date-label,
    .label,
    .time {
      font-size: 18px;
    }

    h1 {
      margin: 4px 0 4px;
      color: var(--text);
      font-size: clamp(36px, 8vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 22px;
    }

    .inline-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-size: 18px;
      font-weight: 750;
      padding: 6px 0;
    }

    .pill-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--primary);
      border-radius: 9999px;
      background: #ffffff;
      color: var(--primary);
      font-size: 18px;
      font-weight: 800;
      padding: 10px 18px;
      white-space: nowrap;
    }

    .back-button {
      min-height: 48px;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-size: 20px;
      font-weight: 750;
      padding: 6px 0;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: min(100%, var(--content-max));
      margin: 0 auto;
      padding: 16px 24px 0;
    }

    .nav-tab {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
    }

    .nav-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .list {
      display: grid;
      gap: 16px;
    }

    .check-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      min-height: 74px;
      gap: 16px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text);
      padding: 16px 24px;
      text-align: left;
      box-shadow: none;
    }

    .check-row.done {
      border-color: var(--success);
      background: var(--done-surface);
    }

    .check {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-radius: 9999px;
      background: #ffffff;
      color: #ffffff;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .done .check {
      border-color: var(--success);
      background: var(--success);
    }

    .check-label {
      min-width: 0;
      color: var(--text);
      font-size: 28px;
      font-weight: 550;
      overflow-wrap: anywhere;
    }

    .done .check-label {
      color: var(--muted);
      text-decoration: line-through;
    }

    .note-card,
    .answer-block,
    .field,
    .empty-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }

    .note-card {
      display: block;
      width: 100%;
      padding: 24px;
      color: inherit;
      text-align: left;
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .note-title {
      margin-bottom: 6px;
      color: var(--text);
      font-size: 28px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .note-preview {
      margin-top: 10px;
      color: var(--muted);
      font-size: 22px;
      overflow-wrap: anywhere;
    }

    .flag {
      display: inline-flex;
      margin-top: 12px;
      border-radius: var(--radius-sm);
      background: #fff4e5;
      color: var(--warn);
      font-size: 16px;
      font-weight: 750;
      padding: 6px 10px;
    }

    .empty {
      margin-top: 32px;
      color: var(--muted);
      font-size: 22px;
      text-align: center;
    }

    .empty small {
      display: block;
      margin-top: 10px;
      font-size: 18px;
    }

    .form {
      display: grid;
      gap: 22px;
    }

    .field-group {
      display: grid;
      gap: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 18px;
    }

    .field {
      width: 100%;
      min-height: 62px;
      padding: 16px;
      color: var(--text);
      font-size: 26px;
      outline: none;
    }

    textarea.field {
      min-height: 230px;
      resize: vertical;
    }

    .field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(31, 111, 235, 0.14);
    }

    .big-button {
      display: inline-flex;
      width: 100%;
      min-height: 78px;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #ffffff;
      font-size: 28px;
      font-weight: 750;
      padding: 16px 24px;
    }

    .big-button.secondary {
      border-color: var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .error-text {
      color: var(--danger);
      font-size: 18px;
      font-weight: 750;
    }

    .answer-block {
      display: grid;
      gap: 12px;
      margin-top: 26px;
      padding: 24px;
    }

    .answer-block.error {
      border-color: var(--danger);
    }

    .quote,
    .body-text {
      color: var(--text);
      font-size: 28px;
      overflow-wrap: anywhere;
    }

    .body-text {
      margin-top: 26px;
      white-space: pre-wrap;
    }

    .read-button {
      justify-self: start;
      min-height: 44px;
      margin-top: 4px;
      border: 1px solid var(--primary);
      border-radius: 9999px;
      background: transparent;
      color: var(--primary);
      font-size: 18px;
      font-weight: 800;
      padding: 8px 16px;
    }

    .other-results {
      display: grid;
      gap: 12px;
      margin-top: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .other-card {
      display: grid;
      gap: 4px;
      padding: 4px 0;
    }

    .other-card .quote {
      font-size: 22px;
    }

    .empty-box {
      margin-top: 26px;
      padding: 24px;
      color: var(--muted);
      font-size: 22px;
    }

    .floating-cta {
      position: fixed;
      left: 50%;
      bottom: 32px;
      display: inline-flex;
      min-height: 64px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 9999px;
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 12px 28px rgba(14, 17, 22, 0.22);
      font-size: 28px;
      font-weight: 750;
      padding: 14px 32px;
      text-decoration: none;
      transform: translateX(-50%);
      z-index: 20;
      white-space: nowrap;
    }

    .floating-cta:hover,
    .big-button:hover,
    .nav-tab:hover,
    .pill-button:hover,
    .check-row:hover,
    .note-card:hover {
      filter: brightness(0.98);
    }

    .plus {
      margin-top: -4px;
      font-size: 34px;
      font-weight: 350;
      line-height: 1;
    }

    .topbar {
      width: min(100%, var(--content-max));
      margin: 0 auto;
      padding: 14px 24px 0;
    }

    .detail-title {
      margin-top: 16px;
      font-size: clamp(34px, 7vw, 42px);
    }

    @media (max-width: 560px) {
      .page,
      .nav-tabs,
      .topbar {
        padding-left: 18px;
        padding-right: 18px;
      }

      .header-row,
      .notes-title-row {
        display: grid;
      }

      .pill-button {
        justify-self: start;
      }

      .check-label,
      .note-title,
      .field,
      .quote,
      .body-text,
      .big-button {
        font-size: 24px;
      }

      .note-preview,
      .subtitle {
        font-size: 20px;
      }

      .floating-cta {
        bottom: 20px;
        min-height: 60px;
        font-size: 24px;
        padding: 12px 24px;
      }
    }

    /* Routine card styles */
    .section-header {
      font-size: 16px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .routine-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .routine-card.done {
      border-color: var(--success);
      background: var(--done-surface);
    }

    .card-header-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      min-height: 74px;
      gap: 16px;
      width: 100%;
      background: transparent;
      border: none;
      padding: 16px 24px;
      text-align: left;
      cursor: pointer;
    }

    .card-check {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      min-width: 40px;
      border: 2px solid var(--border);
      border-radius: 9999px;
      background: #ffffff;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .routine-card.done .card-check {
      border-color: var(--success);
      background: var(--success);
    }

    .card-title-block {
      min-width: 0;
    }

    .card-title {
      color: var(--text);
      font-size: 26px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .card-title.done {
      color: var(--muted);
      text-decoration: line-through;
    }

    .card-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-chevron {
      color: var(--muted);
      font-size: 14px;
      user-select: none;
    }

    .card-body {
      padding: 0 24px 20px;
      display: grid;
      gap: 14px;
    }

    .card-instruction {
      color: var(--text);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.4;
      margin: 0;
    }

    .card-context {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.4;
      margin: 0;
    }

    .card-safety {
      background: #fff4e5;
      border: 1px solid #f0c070;
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }

    .safety-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--warn);
      margin-bottom: 4px;
    }

    .safety-text {
      font-size: 16px;
      color: var(--text);
    }

    .card-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .done-btn {
      flex: 1;
      min-height: 56px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
    }

    .undo-btn {
      flex: 1;
      min-height: 56px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-muted);
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
    }

    .card-edit-row {
      margin-top: 2px;
    }

    .edit-card-link {
      color: var(--primary);
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      min-height: 44px;
      line-height: 44px;
    }

    .add-routine-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      min-height: 44px;
      line-height: 44px;
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>

  <script>
    const STORE_KEY = "kimapp.webPreview.v1";
    const TODAY_ID = "today";
    const NOTES_ID = "notes";
    const DEFAULT_ROUTINE_CARDS_WEB = [
      { id: "routine_morning_water", title: "Morning water", instruction: "Drink one glass of water.", context: "Your cup is next to the sink.", safetyNote: "If the cup is missing, use the blue cup in the cabinet.", section: "morning", sortOrder: 0 },
      { id: "routine_get_dressed", title: "Get dressed", instruction: "Put on today's clothes.", context: "Your outfit is on the chair near the closet.", section: "morning", sortOrder: 1 },
      { id: "routine_medication_plan", title: "Check morning medication plan", instruction: "Check the morning medication plan in your pill organizer.", context: "The pill organizer is next to the coffee maker.", safetyNote: "If anything looks wrong, call the person you trust. Kimapp does not decide doses.", section: "morning", sortOrder: 2 },
      { id: "routine_leaving_home", title: "Before leaving home", instruction: "Check keys, wallet, phone, and glasses.", context: "Your keys are usually in the bowl by the door.", section: "leaving_home", sortOrder: 3 },
      { id: "routine_evening_wind_down", title: "Evening wind-down", instruction: "Turn off the stove area, lock the door, and put your phone on the charger.", context: "The charger is on the bedside table.", section: "evening", sortOrder: 4 }
    ];
    const EXTRA_DEFAULTS_WEB = [
      { id: "routine_leaving_home", title: "Before leaving home", instruction: "Check keys, wallet, phone, and glasses.", context: "Your keys are usually in the bowl by the door.", section: "leaving_home" },
      { id: "routine_evening_wind_down", title: "Evening wind-down", instruction: "Turn off the stove area, lock the door, and put your phone on the charger.", context: "The charger is on the bedside table.", section: "evening" }
    ];
    const STOP_WORDS = new Set([
      "where", "what", "when", "did", "do", "i", "my", "the", "a", "an",
      "is", "are", "was", "were", "to", "of", "for", "about"
    ]);
    const SYNONYM_GROUPS = [
      ["key", "keys"],
      ["med", "meds", "medicine", "medicines", "medication", "medications", "pill", "pills"],
      ["phone", "cell", "cellphone"],
      ["remote", "clicker"],
      ["wallet", "purse"],
      ["glass", "glasses", "eyeglasses"],
      ["note", "notes"]
    ];
    const SYNONYM_LOOKUP = buildSynonymLookup();
    const FUZZY_MIN_LEN = 5;
    const SCORE_FLOOR = 1;
    const MS_PER_DAY = 24 * 60 * 60 * 1000;

    const app = document.querySelector("#app");
    let searchState = { query: "", status: "idle", results: [], error: "" };
    let readLabel = "Read aloud";
    let expandedCardIds = new Set();

    function buildSynonymLookup() {
      const map = new Map();
      for (const group of SYNONYM_GROUPS) {
        const set = new Set(group);
        for (const word of group) map.set(word, set);
      }
      return map;
    }

    function defaultState() {
      const now = new Date().toISOString();
      return {
        routineCards: DEFAULT_ROUTINE_CARDS_WEB.map((c) => ({ ...c, isActive: true, createdAt: now })),
        checklist: [],
        completions: {},
        notes: []
      };
    }

    function getRichCardWeb(text) {
      const t = text.trim().toLowerCase();
      if (t.includes("medication") || t.includes("medication plan")) {
        return { id: "routine_medication_plan", title: "Check morning medication plan", instruction: "Check the morning medication plan in your pill organizer.", context: "The pill organizer is next to the coffee maker.", safetyNote: "If anything looks wrong, call the person you trust. Kimapp does not decide doses.", section: "morning" };
      }
      if (t.includes("water")) {
        return { id: "routine_morning_water", title: "Morning water", instruction: "Drink one glass of water.", context: "Your cup is next to the sink.", safetyNote: "If the cup is missing, use the blue cup in the cabinet.", section: "morning" };
      }
      if (t === "get dressed") {
        return { id: "routine_get_dressed", title: "Get dressed", instruction: "Put on today's clothes.", context: "Your outfit is on the chair near the closet.", section: "morning" };
      }
      if (t.includes("breakfast")) {
        return { id: "routine_eat_breakfast", title: "Eat breakfast", instruction: "Have your morning meal.", section: "morning" };
      }
      if (t.includes("hearing") || t.includes("hearing aids")) {
        return { id: "routine_hearing_aids", title: "Bring hearing aids and glasses", instruction: "Put on your hearing aids and glasses.", section: "morning" };
      }
      return null;
    }

    function migrateChecklistToRoutineCards(checklist) {
      const now = new Date().toISOString();
      const cards = [];
      const insertedIds = new Set();
      let maxSort = 0;
      for (const item of checklist) {
        if (item.active === false) continue;
        const sort = item.sortOrder ?? 0;
        if (sort > maxSort) maxSort = sort;
        const rich = getRichCardWeb(item.text);
        cards.push({
          id: rich ? rich.id : ("routine_custom_" + Math.random().toString(36).slice(2, 8)),
          title: rich ? rich.title : item.text,
          instruction: rich ? rich.instruction : item.text,
          context: rich ? (rich.context ?? null) : null,
          safetyNote: rich ? (rich.safetyNote ?? null) : null,
          section: rich ? rich.section : "morning",
          sortOrder: sort,
          isActive: true,
          createdAt: now
        });
        if (rich) insertedIds.add(rich.id);
      }
      let extraSort = maxSort + 1;
      for (const def of EXTRA_DEFAULTS_WEB) {
        if (!insertedIds.has(def.id)) {
          cards.push({ ...def, isActive: true, sortOrder: extraSort++, createdAt: now });
        }
      }
      return cards;
    }

    function sectionLabel(section) {
      switch (section) {
        case "morning": return "Morning";
        case "afternoon": return "Afternoon";
        case "evening": return "Evening";
        case "leaving_home": return "Before leaving home";
        case "bedtime": return "Bedtime";
        case "custom": return "Other";
        default: return section;
      }
    }

    function loadState() {
      const fallback = defaultState();
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        let routineCards = Array.isArray(parsed.routineCards) && parsed.routineCards.length
          ? parsed.routineCards
          : null;
        if (!routineCards) {
          const checklist = Array.isArray(parsed.checklist) ? parsed.checklist : [];
          routineCards = checklist.length > 0
            ? migrateChecklistToRoutineCards(checklist)
            : fallback.routineCards;
        }
        return {
          routineCards,
          checklist: Array.isArray(parsed.checklist) ? parsed.checklist : [],
          completions: parsed.completions && typeof parsed.completions === "object"
            ? parsed.completions
            : {},
          notes: Array.isArray(parsed.notes) ? parsed.notes : []
        };
      } catch {
        return fallback;
      }
    }

    function saveState(state) {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    function todayKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatToday() {
      return new Date().toLocaleDateString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
    }

    function formatTimestamp(value) {
      const date = new Date(value);
      const now = new Date();
      const sameDay = date.toDateString() === now.toDateString();
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const time = date.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      if (sameDay) return `Today, ${time}`;
      if (date.toDateString() === yesterday.toDateString()) return `Yesterday, ${time}`;
      const day = date.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric"
      });
      return `${day}, ${time}`;
    }

    function formatFull(value) {
      const date = new Date(value);
      const day = date.toLocaleDateString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
      const time = date.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      return `${day} | ${time}`;
    }

    function formatRecordedAt(value) {
      const date = new Date(value);
      const now = new Date();
      const sameDay = date.toDateString() === now.toDateString();
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const time = date.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      if (sameDay) return `today at ${time}`;
      if (date.toDateString() === yesterday.toDateString()) return `yesterday at ${time}`;
      const day = date.toLocaleDateString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
      return `${day} at ${time}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function firstLine(value) {
      const line = String(value ?? "").split("\n")[0].trim();
      return line.length > 60 ? `${line.slice(0, 60).trim()}...` : line;
    }

    function noteDisplayTitle(note) {
      const title = (note.title ?? "").trim();
      const body = (note.transcript ?? "").trim();
      return title || (body ? firstLine(body) : "Untitled note");
    }

    function route() {
      const hash = window.location.hash || "#/today";
      const path = hash.replace(/^#\/?/, "");
      if (!path || path === TODAY_ID) return { name: TODAY_ID };
      if (path === NOTES_ID) return { name: NOTES_ID };
      if (path === "new-note") return { name: "new-note" };
      if (path === "ask-notes") return { name: "ask-notes" };
      if (path === "routine/new") return { name: "routine-new" };
      const routineEdit = path.match(/^routine\/(.+)$/);
      if (routineEdit) return { name: "routine-edit", id: decodeURIComponent(routineEdit[1]) };
      const detail = path.match(/^notes\/(.+)$/);
      if (detail) return { name: "note-detail", id: decodeURIComponent(detail[1]) };
      return { name: TODAY_ID };
    }

    function setRoute(path) {
      window.location.hash = path;
    }

    function normalizeText(value) {
      return String(value ?? "")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s']/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function tokenize(value) {
      const normalized = normalizeText(value);
      return normalized ? normalized.split(" ").filter(Boolean) : [];
    }

    function extractSearchTerms(query) {
      const seen = new Set();
      const terms = [];
      for (const token of tokenize(query)) {
        if (STOP_WORDS.has(token)) continue;
        if (token.length < 2) continue;
        if (seen.has(token)) continue;
        seen.add(token);
        terms.push(token);
      }
      return terms;
    }

    function expandTerm(term) {
      return SYNONYM_LOOKUP.get(term) || new Set([term]);
    }

    function levenshteinAtMostOne(a, b) {
      if (a === b) return true;
      const lenDiff = Math.abs(a.length - b.length);
      if (lenDiff > 1) return false;

      if (a.length === b.length) {
        let mismatches = 0;
        for (let i = 0; i < a.length; i += 1) {
          if (a[i] !== b[i]) {
            mismatches += 1;
            if (mismatches > 1) return false;
          }
        }
        return true;
      }

      const shorter = a.length < b.length ? a : b;
      const longer = a.length < b.length ? b : a;
      let i = 0;
      let j = 0;
      let edits = 0;
      while (i < shorter.length && j < longer.length) {
        if (shorter[i] === longer[j]) {
          i += 1;
          j += 1;
        } else {
          edits += 1;
          if (edits > 1) return false;
          j += 1;
        }
      }
      return true;
    }

    function matchTermAgainstTokens(term, titleTokens, transcriptTokens) {
      const expanded = expandTerm(term);
      const titleSet = new Set(titleTokens);
      const transcriptSet = new Set(transcriptTokens);
      let directInTitle = false;
      let directInTranscript = false;
      let synonymInTitle = false;
      let synonymInTranscript = false;

      for (const variant of expanded) {
        const inTitle = titleSet.has(variant);
        const inTranscript = transcriptSet.has(variant);
        if (!inTitle && !inTranscript) continue;
        if (variant === term) {
          directInTitle = directInTitle || inTitle;
          directInTranscript = directInTranscript || inTranscript;
        } else {
          synonymInTitle = synonymInTitle || inTitle;
          synonymInTranscript = synonymInTranscript || inTranscript;
        }
      }

      if (directInTitle || directInTranscript) {
        return { kind: "direct", fieldsHit: { title: directInTitle, transcript: directInTranscript } };
      }
      if (synonymInTitle || synonymInTranscript) {
        return { kind: "synonym", fieldsHit: { title: synonymInTitle, transcript: synonymInTranscript } };
      }

      if (term.length >= FUZZY_MIN_LEN) {
        const fuzzyTitle = titleTokens.some((token) => token.length >= FUZZY_MIN_LEN - 1 && levenshteinAtMostOne(term, token));
        const fuzzyTranscript = transcriptTokens.some((token) => token.length >= FUZZY_MIN_LEN - 1 && levenshteinAtMostOne(term, token));
        if (fuzzyTitle || fuzzyTranscript) {
          return { kind: "fuzzy", fieldsHit: { title: fuzzyTitle, transcript: fuzzyTranscript } };
        }
      }

      return null;
    }

    function scoreNote(note, normalizedQuery, terms) {
      const titleNormalized = note.title ? normalizeText(note.title) : "";
      const transcriptNormalized = note.transcript ? normalizeText(note.transcript) : "";
      const titleTokens = titleNormalized ? titleNormalized.split(" ") : [];
      const transcriptTokens = transcriptNormalized ? transcriptNormalized.split(" ") : [];
      const queryWordCount = normalizedQuery ? normalizedQuery.split(" ").length : 0;
      let score = 0;
      let hasPhraseMatch = false;
      let ideaCount = 0;
      const matchedTerms = [];

      if (normalizedQuery && queryWordCount >= 2) {
        if (titleNormalized.includes(normalizedQuery)) {
          score += 20;
          hasPhraseMatch = true;
        } else if (transcriptNormalized.includes(normalizedQuery)) {
          score += 15;
          hasPhraseMatch = true;
        }
      }

      for (const term of terms) {
        const match = matchTermAgainstTokens(term, titleTokens, transcriptTokens);
        if (!match) continue;
        matchedTerms.push(term);
        if (match.kind === "direct") {
          ideaCount += 1;
          if (match.fieldsHit.title) score += 6;
          if (match.fieldsHit.transcript) score += 3;
        } else if (match.kind === "synonym") {
          ideaCount += 1;
          if (match.fieldsHit.title) score += 4;
          if (match.fieldsHit.transcript) score += 2;
        } else {
          if (match.fieldsHit.title) score += 2;
          if (match.fieldsHit.transcript) score += 1;
        }
      }

      if (score > 0) {
        const ageDays = (Date.now() - new Date(note.createdAt).getTime()) / MS_PER_DAY;
        if (ageDays < 1) score += 3;
        else if (ageDays < 2) score += 1;
      }

      return { score, matchedTerms, ideaCount, hasPhraseMatch };
    }

    function rankNotes(notes, query) {
      const terms = extractSearchTerms(query);
      if (terms.length === 0) return [];
      const normalizedQuery = normalizeText(query);
      const results = [];
      for (const note of notes) {
        const scored = scoreNote(note, normalizedQuery, terms);
        if (scored.score < SCORE_FLOOR) continue;
        if (scored.matchedTerms.length === 0 && !scored.hasPhraseMatch) continue;
        results.push({
          note,
          score: scored.score,
          matchedTerms: scored.matchedTerms,
          confidence: scored.hasPhraseMatch || scored.ideaCount >= 2 ? "strong" : "possible"
        });
      }
      return results.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return new Date(b.note.createdAt).getTime() - new Date(a.note.createdAt).getTime();
      });
    }

    function quoteOf(result) {
      return ((result.note.transcript ?? result.note.title) || "").trim();
    }

    function spokenAnswerFor(result) {
      const header = result.confidence === "strong"
        ? "I found this saved note:"
        : "This might be related:";
      const quote = quoteOf(result);
      return `${header} ${quote ? `"${quote}". ` : ""}Recorded ${formatRecordedAt(result.note.createdAt)}.`;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        readLabel = "Speech unavailable";
        render();
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.92;
      utterance.onend = () => {
        readLabel = "Read aloud";
        render();
      };
      utterance.onerror = () => {
        readLabel = "Read aloud";
        render();
      };
      readLabel = "Stop reading";
      window.speechSynthesis.speak(utterance);
      render();
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      readLabel = "Read aloud";
    }

    function renderToday(state) {
      const key = todayKey();
      const completions = state.completions[key] || {};
      const cards = (state.routineCards || [])
        .filter((c) => c.isActive !== false)
        .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
      const remaining = cards.filter((c) => completions[c.id] !== "done").length;
      const subtitle = remaining === 0 && cards.length > 0
        ? "All done. Nice work."
        : `${remaining} of ${cards.length} left`;

      let lastSection = null;
      const rows = cards.map((card) => {
        const done = completions[card.id] === "done";
        const expanded = expandedCardIds.has(card.id);
        let headerHtml = "";
        if (card.section && card.section !== lastSection) {
          headerHtml = `<div class="section-header">${escapeHtml(sectionLabel(card.section))}</div>`;
          lastSection = card.section;
        }
        const bodyHtml = expanded ? `
          <div class="card-body">
            <p class="card-instruction">${escapeHtml(card.instruction)}</p>
            ${card.context ? `<p class="card-context">${escapeHtml(card.context)}</p>` : ""}
            ${card.safetyNote ? `<div class="card-safety"><div class="safety-label">If unsure:</div><div class="safety-text">${escapeHtml(card.safetyNote)}</div></div>` : ""}
            <div class="card-actions">
              <button class="read-button" data-action="read-card" data-id="${escapeHtml(card.id)}">Read aloud</button>
              <button class="${done ? "undo-btn" : "done-btn"}" data-action="toggle-done" data-id="${escapeHtml(card.id)}">${done ? "Undo done" : "Mark done"}</button>
            </div>
            <div class="card-edit-row">
              <a class="edit-card-link" href="#/routine/${encodeURIComponent(card.id)}">Edit</a>
            </div>
          </div>
        ` : "";
        return `
          ${headerHtml}
          <div class="routine-card ${done ? "done" : ""}">
            <div class="card-header-row" data-action="toggle-expand" data-id="${escapeHtml(card.id)}" role="button" aria-expanded="${expanded}" tabindex="0">
              <button class="card-check" data-action="toggle-done" data-id="${escapeHtml(card.id)}" aria-pressed="${done}">${done ? "&#10003;" : ""}</button>
              <div class="card-title-block">
                <div class="card-title ${done ? "done" : ""}">${escapeHtml(card.title)}</div>
                ${!expanded && card.context ? `<div class="card-subtitle">${escapeHtml(card.context)}</div>` : ""}
              </div>
              <span class="card-chevron">${expanded ? "▲" : "▼"}</span>
            </div>
            ${bodyHtml}
          </div>
        `;
      }).join("");

      return `
        ${renderTabs(TODAY_ID)}
        <section class="page">
          <div class="header-block">
            <div class="date-label">${escapeHtml(formatToday())}</div>
            <h1>Today's routine</h1>
            <p class="subtitle">${escapeHtml(subtitle)}</p>
            <button class="inline-link" data-action="go" data-path="/ask-notes">Ask saved notes</button>
          </div>
          <div class="list">
            ${rows || `<p class="empty">Tap "Add routine" to add your first routine step.</p>`}
          </div>
          <a class="add-routine-link" href="#/routine/new">+ Add routine</a>
        </section>
        ${renderFloatingCta()}
      `;
    }

      `;
    }

    function render() {
      const state = loadState();
      const current = route();
      if (current.name === TODAY_ID) app.innerHTML = renderToday(state);
      else if (current.name === NOTES_ID) app.innerHTML = renderNotes(state);
      else if (current.name === "new-note") app.innerHTML = renderNewNote();
      else if (current.name === "ask-notes") app.innerHTML = renderAskNotes();
      else if (current.name === "note-detail") app.innerHTML = renderNoteDetail(state, current.id);
      else if (current.name === "routine-new") app.innerHTML = renderRoutineNew();
      else if (current.name === "routine-edit") app.innerHTML = renderRoutineEdit(state, current.id);
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "go") {
        setRoute(target.dataset.path || "/today");
      }
      if (action === "back") {
        stopSpeech();
        if (history.length > 1) history.back();
        else setRoute("/today");
      }
      if (action === "toggle-expand") {
        const cardId = target.dataset.id;
        if (expandedCardIds.has(cardId)) {
          expandedCardIds.delete(cardId);
        } else {
          expandedCardIds.add(cardId);
        }
        render();
      }
      if (action === "toggle-done") {
        const state = loadState();
        const key = todayKey();
        const cardId = target.dataset.id;
        state.completions[key] = state.completions[key] || {};
        if (state.completions[key][cardId] === "done") {
          delete state.completions[key][cardId];
        } else {
          state.completions[key][cardId] = "done";
        }
        saveState(state);
        render();
      }
      if (action === "read-card") {
        const cardId = target.dataset.id;
        const state = loadState();
        const card = (state.routineCards || []).find((c) => c.id === cardId);
        if (!card) return;
        const text = [card.title, card.instruction, card.context, card.safetyNote].filter(Boolean).join(". ");
        if (readLabel === "Stop reading") {
          stopSpeech();
          render();
        } else {
          speak(text);
        }
      }
      if (action === "remove-card") {
        const cardId = target.dataset.id;
        if (!confirm("Remove this routine card? Your past completions are kept.")) return;
        const state = loadState();
        const card = (state.routineCards || []).find((c) => c.id === cardId);
        if (card) card.isActive = false;
        saveState(state);
        setRoute("/today");
      }
      if (action === "read-result") {
        const result = searchState.results[Number(target.dataset.index || 0)];
        if (!result) return;
        if (readLabel === "Stop reading") {
          stopSpeech();
          render();
        } else {
          speak(spokenAnswerFor(result));
        }
      }
      if (action === "read-text") {
        const text = target.dataset.text || "";
        if (readLabel === "Stop reading") {
          stopSpeech();
          render();
        } else {
          speak(text);
        }
      }
    });

    document.addEventListener("input", (event) => {
      if (event.target.id === "ask-query") {
        searchState.query = event.target.value;
        if (searchState.status === "error") searchState.status = "idle";
        const button = document.querySelector("#ask-form .big-button");
        if (button) button.disabled = !searchState.query.trim();
      }
    });

    document.addEventListener("submit", (event) => {
      if (event.target.id === "note-form") {
        event.preventDefault();
        const form = event.target;
        const title = form.elements.title.value.trim();
        const body = form.elements.body.value.trim();
        const error = form.querySelector("#note-error");
        if (!title && !body) {
          error.hidden = false;
          error.textContent = "Add a name or some content before saving.";
          return;
        }
        const state = loadState();
        state.notes.push({
          id: `note_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          title: title || null,
          transcript: body || null,
          createdAt: new Date().toISOString(),
          updatedAt: null,
          sourceUser: "patient",
          verifiedByCaregiver: false,
          needsReview: false,
          archivedAt: null
        });
        saveState(state);
        searchState = { query: "", status: "idle", results: [], error: "" };
        setRoute("/notes");
      }

      if (event.target.id === "routine-new-form") {
        event.preventDefault();
        const form = event.target;
        const title = form.elements.title.value.trim();
        const instruction = form.elements.instruction.value.trim();
        const context = form.elements.context.value.trim();
        const safetyNote = form.elements.safetyNote.value.trim();
        const section = form.elements.section.value;
        const errorEl = form.querySelector("#routine-new-error");
        if (!title || !instruction) {
          errorEl.hidden = false;
          errorEl.textContent = "Title and instruction are required.";
          return;
        }
        errorEl.hidden = true;
        const state = loadState();
        const maxSort = (state.routineCards || []).reduce((mx, c) => Math.max(mx, c.sortOrder ?? 0), 0);
        state.routineCards = state.routineCards || [];
        state.routineCards.push({
          id: "routine_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          title,
          instruction,
          context: context || null,
          safetyNote: safetyNote || null,
          section: section || null,
          sortOrder: maxSort + 1,
          isActive: true,
          createdAt: new Date().toISOString()
        });
        saveState(state);
        setRoute("/today");
      }

      if (event.target.id === "routine-edit-form") {
        event.preventDefault();
        const form = event.target;
        const id = form.dataset.id;
        const title = form.elements.title.value.trim();
        const instruction = form.elements.instruction.value.trim();
        const context = form.elements.context.value.trim();
        const safetyNote = form.elements.safetyNote.value.trim();
        const section = form.elements.section.value;
        const errorEl = form.querySelector("#routine-edit-error");
        if (!title || !instruction) {
          errorEl.hidden = false;
          errorEl.textContent = "Title and instruction are required.";
          return;
        }
        errorEl.hidden = true;
        const state = loadState();
        const card = (state.routineCards || []).find((c) => c.id === id);
        if (card) {
          card.title = title;
          card.instruction = instruction;
          card.context = context || null;
          card.safetyNote = safetyNote || null;
          card.section = section || null;
        }
        saveState(state);
        setRoute("/today");
      }

      if (event.target.id === "ask-form") {
        event.preventDefault();
        const query = searchState.query.trim();
        if (!query) return;
        stopSpeech();
        searchState.status = "searching";
        render();
        window.setTimeout(() => {
          try {
            const state = loadState();
            searchState.results = rankNotes(state.notes, query);
            searchState.status = "done";
          } catch (error) {
            searchState.results = [];
            searchState.status = "error";
          }
          render();
        }, 120);
      }
    });

    window.addEventListener("hashchange", () => {
      stopSpeech();
      render();
    });

    window.addEventListener("beforeunload", stopSpeech);
    window.setInterval(() => {
      const current = route();
      const canRefresh = current.name === TODAY_ID || current.name === NOTES_ID || current.name === "note-detail";
      if (canRefresh && readLabel !== "Stop reading") render();
    }, 30000);

    if (!window.location.hash) {
      window.location.hash = "/today";
    }
    render();
  </script>
</body>
</html>
